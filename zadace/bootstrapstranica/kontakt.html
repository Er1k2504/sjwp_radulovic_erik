<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kontakt Forma</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f7fa;
            font-family: Arial, sans-serif;
        }

        .contact-container {
            max-width: 800px;
            margin: 50px auto;
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #0d6efd;
        }

        .btn-custom {
            background-color: #0d6efd;
            color: white;
            padding: 10px 25px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-custom:hover {
            background-color: #084298;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="contact-container">

        <h2>Kontakt</h2>

        <form action="#" method="GET">

            <div class="row">
               <div class="col-md-6 mb-3">
                    <label for="ime" class="form-label">Ime</label>
                    <input type="text" class="form-control" id="ime" name="ime" placeholder="Unesite vaše ime" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Unesite vaš email" required>
                </div>

            </div>

            <div class="mb-3">
                <label for="datum" class="form-label">Odaberite datum</label>
                <input type="date" class="form-control" id="datum" name="datum">
            </div>

            <div class="mb-3">
                <label for="poruka" class="form-label">Poruka</label>
                <textarea class="form-control" id="poruka" name="poruka" rows="5" placeholder="Unesite vašu poruku"></textarea>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-custom">
                    Pošalji Poruku
                </button>
            </div>

        </form>

    </div>
</div>

</body>
</html>
