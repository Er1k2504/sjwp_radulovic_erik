<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kontakt Forma</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .navbar{
            background-color: rgb(94, 108, 148) !important;
        }

        body{
            background-color: rgb(148, 155, 194);
            font-family: Arial, sans-serif;
        }

        .kontaktcontainer{
            max-width: 800px;
            margin: 50px auto;
            background-color:  rgb(94, 108, 148);
            padding: 35px;
            border-radius: 12px;
        }

        h2{
            text-align: center;
            margin-bottom: 30px;
            color: #ffffff;
        }

        .btn-custom{
            background-color: #ffffff;
            color: rgb(2, 2, 2);
            padding: 10px 25px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-custom:hover{
            background-color: #8a8a8a;
        }


    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">
            <img src="https://emojiisland.com/cdn/shop/products/Dark_Blue_Moon_Emoji_large.png?v=1571606063" alt="Logo" width="40" height="40" class="me-2">
            Moja Stranica
          </a>
      
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
          </button>
      
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link active" href="ja.html">Početna</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="ja.html">Moji hobiji</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="kontakt.html">Kontakt</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>  

<div class="container">
    <div class="kontaktcontainer">

        <h2>Kontakt</h2>

        <form action="#" method="GET">

            <div class="row">
               <div class="col-md-6 mb-3">
                    <label for="ime" class="form-label">Ime</label>
                    <input type="text" class="form-control" id="ime" name="ime" placeholder="Unesite vaše ime" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Unesite vaš email" required>
                </div>

            </div>

            <div class="mb-3">
                <label for="datum" class="form-label">Odaberite datum</label>
                <input type="date" class="form-control" id="datum" name="datum">
            </div>

            <div class="mb-3">
                <label for="poruka" class="form-label">Poruka</label>
                <textarea class="form-control" id="poruka" name="poruka" rows="5" placeholder="Unesite vašu poruku"></textarea>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-custom">
                    Pošalji Poruku
                </button>
            </div>

        </form>

    </div>
</div>

</body>
</html>
